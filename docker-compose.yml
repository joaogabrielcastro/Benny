# Benny — ambiente local com Docker (testes sem deploy em produção)
#
# Uso rápido:
#   cp .env.docker.example .env.docker
#   docker compose --env-file .env.docker up --build
#
# Acessos:
#   Frontend: http://localhost:8080
#   API:      http://localhost:3011/api/health
#   Login:    admin@oficina.com / 123456

services:
  db:
    image: postgres:16-alpine
    container_name: benny-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-benny}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-benny_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-benny}
    volumes:
      - benny_pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-benny} -d ${POSTGRES_DB:-benny}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: benny-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-benny}:${POSTGRES_PASSWORD:-benny_dev_secret}@db:5432/${POSTGRES_DB:-benny}?sslmode=disable
      PORT: 3011
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-docker-dev-jwt-secret-minimo-32-caracteres}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-1}
      SKIP_DB_INIT_DDL: ${SKIP_DB_INIT_DDL:-true}
      DOCKER_BOOTSTRAP_DB: ${DOCKER_BOOTSTRAP_DB:-true}
      DOCKER_ADMIN_EMAIL: ${DOCKER_ADMIN_EMAIL:-admin@oficina.com}
      DOCKER_ADMIN_PASSWORD: ${DOCKER_ADMIN_PASSWORD:-123456}
      DOCKER_ADMIN_NOME: ${DOCKER_ADMIN_NOME:-Administrador}
      STORAGE_DIR: /app/storage
      NOTAAS_API_KEY: ${NOTAAS_API_KEY:-}
      NOTAAS_API_URL: ${NOTAAS_API_URL:-https://platform.notaas.com.br/api/v1}
      NOTAAS_CNPJ_EMITENTE: ${NOTAAS_CNPJ_EMITENTE:-55961553000100}
      NOTAAS_AMBIENTE: ${NOTAAS_AMBIENTE:-homologacao}
      NOTAAS_CODIGO_MUNICIPIO_IBGE: ${NOTAAS_CODIGO_MUNICIPIO_IBGE:-4105805}
      NOTAAS_C_TRIB_NAC: ${NOTAAS_C_TRIB_NAC:-310103}
      NOTAAS_C_NBS: ${NOTAAS_C_NBS:-120013110}
      NOTAAS_ALIQUOTA_ISS: ${NOTAAS_ALIQUOTA_ISS:-2}
      NOTAAS_NFE_ENABLED: ${NOTAAS_NFE_ENABLED:-false}
      WDAPI2_TOKEN: ${WDAPI2_TOKEN:-}
      PLACAFIPE_TOKEN: ${PLACAFIPE_TOKEN:-}
      FIPE_PLACA_API_KEY: ${FIPE_PLACA_API_KEY:-}
    ports:
      - "3011:3011"
    volumes:
      - benny_storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3011/api}
    container_name: benny-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  benny_pgdata:
  benny_storage:
