name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: benny
          POSTGRES_PASSWORD: benny
          POSTGRES_DB: benny_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U benny -d benny_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://benny:benny@localhost:5432/benny_test?sslmode=disable
      JWT_SECRET: ci-jwt-secret-minimum-32-characters-long
      # Schema sobe 1x no step "Aguardar schema"; testes não devem reexecutar DDL
      # em paralelo (node --test workers) — evita corrida e falha de IPC do runner.
      SKIP_DB_INIT_DDL: "true"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Inicializar schema (DDL de boot)
        run: node --input-type=module -e "import { initDatabase } from './database.js'; await initDatabase();"
      - name: Aplicar migrations
        run: npm run migrate
      - run: npm test
      - run: npm run test:integration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
