server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Compactação — menos bytes quando o proxy comprime de novo (menos timeouts esporádicos)
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Use no Coolify como caminho de health check (porta interna 80)
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
