# Sobrescreve serviços para hot reload (código montado do host).
# Uso:
#   docker compose --env-file .env.docker -f docker-compose.yml -f docker-compose.dev.yml up --build

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
    volumes:
      - ./backend:/app
      - benny_backend_node_modules:/app/node_modules
    ports:
      - "3011:3011"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_DEV_PROXY_TARGET: ${VITE_DEV_PROXY_TARGET:-http://backend:3011}
    volumes:
      - ./frontend:/app
      - benny_frontend_node_modules:/app/node_modules
    ports:
      - "5177:5177"

volumes:
  benny_backend_node_modules:
  benny_frontend_node_modules:
